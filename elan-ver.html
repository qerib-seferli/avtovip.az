<!doctype html><html lang="az"><head><meta charset="utf-8"><script data-avtovip-boot>(function(){try{var l=localStorage.getItem('avtovip-lang')||'az',t=localStorage.getItem('avtovip-theme')||((matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.lang=l;document.documentElement.dataset.lang=l;document.documentElement.dataset.theme=t;document.documentElement.classList.add('av-preboot')}catch(e){}})();</script><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#9d111b"><link rel="manifest" href="site.webmanifest"><link rel="icon" href="assets/img/brand/icon-192.png"><link rel="apple-touch-icon" href="assets/img/brand/icon-192.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/css/app.css?v=20"><link rel="stylesheet" href="assets/css/patch11.css?v=20"><title>Elan yerləşdir — AvtoVİP</title><meta name="description" content="AvtoVİP avtomobil bazarı"><link rel="stylesheet" href="assets/css/ui-pro.css?v=66"><link rel="stylesheet" href="assets/css/profile-final.css?v=1"></head><body data-page="create-listing"><header class="site-header"><div class="container header-row"><a class="brand" href="index.html"><img src="assets/img/brand/logo.png" alt="AvtoVİP"><span class="brand-copy"><strong>AvtoVİP</strong><span>Premium avtomobil bazarı</span></span></a><div class="header-actions"><div class="header-control"><select id="langSelect"><option value="az">AZ</option><option value="en">EN</option><option value="ru">RU</option><option value="tr">TR</option><option value="ka">KA</option></select></div><button class="icon-btn" id="themeBtn" aria-label="Tema"></button><a class="icon-btn" id="accountBtn" href="login.html"><i class="fa-regular fa-user"></i><span class="label">Giriş</span></a></div></div></header><main class="page"><div class="container form-shell stack"><div><h1 style="font-size:22px;margin:0">Avtomobil elanı yerləşdir</h1></div><form id="listingForm" class="stack">
<section class="panel form-section"><h2>Əsas məlumatlar</h2><div class="field-grid"><div class="field"><label>Marka *</label><select id="brand" name="brand" required></select></div><div class="field"><label>Model *</label><input id="model" name="model" list="modelList" required maxlength="80" placeholder="Məs: Camry"><datalist id="modelList"></datalist></div><div class="field"><label>Nəsil</label><input name="generation" maxlength="60" placeholder="Məs: G30 / XV70"></div><div class="field"><label>Komplektasiya</label><input name="trim" maxlength="80" placeholder="Məs: XSE / AMG"></div></div></section>
<section class="panel form-section"><h2><i class="fa-solid fa-location-dot"></i> Məkan</h2><div class="field-grid"><div class="field"><label>Ölkə *</label><select id="country" name="country_code" required></select></div><div class="field"><label>Region / Ştat</label><select id="state" name="state_name"></select></div><div class="field"><label>Şəhər *</label><input id="city" name="city" list="cityList" required autocomplete="off" placeholder="Şəhər"><datalist id="cityList"></datalist></div><div class="field"><label>Rayon / Bölgə</label><input id="district" name="district" maxlength="100" placeholder="Rayon, county, district..."></div></div></section>
<section class="panel form-section"><h2><i class="fa-solid fa-coins"></i> Qiymət və il</h2><div class="field-grid"><div class="field"><label>Qiymət *</label><input name="price" type="number" min="0" step="1" required></div><div class="field"><label>Valyuta</label><select id="currency" name="currency" required></select></div><div class="field"><label>Buraxılış ili *</label><input name="year" type="number" min="1885" max="2100" required></div><div class="field"><label>Vəziyyət *</label><select id="condition" name="condition" required><option value="">Seçin</option><option value="new">Yeni</option><option value="used">Sürülmüş</option></select></div></div></section>
<section class="panel form-section"><h2><i class="fa-solid fa-gauge-high"></i> Texniki göstəricilər</h2><div class="field-grid"><div class="field"><label>Yürüş, km *</label><input name="mileage" type="number" min="0" required></div><div class="field"><label>Mühərrik, L</label><input name="engine_volume" type="number" min="0" max="20" step="0.1" inputmode="decimal"></div><div class="field"><label>Güc, a.g.</label><input name="engine_power" type="number" min="0" max="3000"></div><div class="field"><label>Yanacaq</label><select id="fuel" name="fuel"></select></div><div class="field"><label>Sürətlər qutusu</label><select id="transmission" name="transmission"></select></div><div class="field"><label>Ötürücü</label><select id="drivetrain" name="drivetrain"></select></div><div class="field"><label>Ban növü</label><select id="bodyType" name="body_type"></select></div><div class="field"><label>Rəng</label><select id="color" name="color"></select></div><div class="field"><label>Oturacaq sayı</label><input name="seats" type="number" min="1" max="100"></div><div class="field"><label>Sahib sayı</label><input name="owners_count" type="number" min="0" max="99"></div><div class="field"><label>Bazar mənşəyi</label><input name="market_origin" placeholder="ABŞ / Koreya / Rəsmi diler..."></div><div class="field"><label>VIN</label><input name="vin" maxlength="17" autocomplete="off" placeholder="VIN" style="text-transform:uppercase"></div></div></section>
<section class="panel form-section"><h2><i class="fa-solid fa-circle-check"></i> Əlavə şərtlər</h2><div class="row-wrap"><label class="check-chip"><input type="checkbox" name="is_credit"><span>Kredit</span></label><label class="check-chip"><input type="checkbox" name="is_barter"><span>Barter</span></label><label class="check-chip"><input type="checkbox" name="has_accident"><span>Vuruğu var</span></label><label class="check-chip"><input type="checkbox" name="is_painted"><span>Rənglənib</span></label></div></section>
<section class="panel form-section"><h2><i class="fa-solid fa-car-side"></i> Avtomobilin təchizatı</h2><div class="check-grid equipment-filter-grid" id="equipmentGrid"></div></section>
<section class="panel form-section"><h2>Şəkillər</h2><div class="upload-input"><input id="listingImages" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif,.heic,.heif" multiple required><p class="form-note">Minimum 3, maksimum 15 şəkil. Hər fayl maksimum 10 MB.</p></div><div class="upload-grid" id="imagePreview" style="margin-top:9px"></div></section>
<section class="panel form-section"><h2>Satıcı və açıqlama</h2><div class="field-grid"><div class="field"><label>Telefon *</label><input name="phone" type="tel" required placeholder="+994 50 000 00 00"></div><div class="field"><label>WhatsApp nömrəsi</label><input name="whatsapp_phone" type="tel" placeholder="+994 50 000 00 00"></div><div class="field field-wide"><label>Açıqlama</label><textarea name="description" maxlength="4000" placeholder="Avtomobilin vəziyyəti, servis tarixi və digər vacib məlumatları yazın."></textarea></div></div></section>
<div class="sticky-submit"><button id="submitListing" class="btn btn-block btn-lg" type="submit"><i class="fa-solid fa-paper-plane"></i> Elanı yerləşdir</button><div id="listingStatus" class="form-status"></div></div></form></div></main><nav class="bottom-nav"><a href="index.html" data-nav="home"><i class="fa-solid fa-house"></i><span data-i18n="home">Əsas</span></a><a href="explore.html" data-nav="explore"><i class="fa-regular fa-compass"></i><span>Kəşfet</span></a><a class="create-nav" href="elan-ver.html" data-nav="create"><i class="fa-solid fa-plus"></i><span data-i18n="create">Elan ver</span></a><a href="mesajlar.html" data-nav="messages" style="position:relative"><i class="fa-regular fa-comment"></i><span data-i18n="messages">Mesajlar</span><b id="messageBadge" class="badge premium" style="position:absolute;right:8px;top:2px;height:16px;min-width:16px;padding:0 4px" hidden></b></a><a href="profile.html" data-nav="profile"><i class="fa-regular fa-user"></i><span data-i18n="profile">Profil</span></a></nav><div id="toastStack" class="toast-stack"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/international.js"></script><script src="assets/js/app.js?v=79"></script><script src="assets/js/social.js?v=32"></script><script src="assets/js/patch11.js?v=20"></script><script src="assets/js/ui-pro.js?v=59"></script></body></html>
