}.tile:hover{border-color:var(--accent)}.tile.chosen{border-color:var(--accent);background:var(--selected)}.tile .check{position:absolute;top:9px;right:9px;width:22px;height:22px;accent-color:var(--accent)}.tile img{width:88px;height:70px;object-fit:contain;display:block}.tile .initial{display:grid;place-items:center;width:70px;height:70px;border-radius:12px;background:var(--bg);font-size:27px;font-weight:700;color:var(--muted)}.tile .brand{font-weight:650;overflow-wrap:anywhere}.tile .status{font-size:11px;color:var(--muted)}.tile .status.bad{color:var(--bad)}.tile .status.good{color:var(--good)}.tile .models{font-size:11px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:40px 0}.pager{display:flex;justify-content:center;gap:10px;margin:18px 0 35px}.footer{color:var(--muted);font-size:12px;margin-top:20px}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-width:500px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{min-height:155px}.head h1{font-size:18px}.actions button{flex:1}}

<header><div class="wrap"><div class="head"><div><h1>AvtoVIP <span id="heading">Logo QA</span></h1><small id="subtitle"></small></div><div class="head-controls"><label class="sr" for="lang">Language</label><select id="lang" aria-label="Language"><option value="az">AZ</option><option value="en">EN</option><option value="ru">RU</option><option value="tr">TR</option><option value="ka">KA</option></select><button id="theme" type="button"></button></div></div></div></header>

<script>
(()=>{'use strict';

en:{heading:'Logo review',subtitle:'Unlisted review page • all 8 categories',notice:'Select brands with incorrect, unrelated, low-quality or missing logos. Selections are saved in this browser. The URL is unlisted, not access-protected.',search:'Search brands...',all:'All brands',missing:'Missing / broken logos',selected:'Selected',models0:'No models',total:'Brands',available:'Loaded logos',broken:'Missing logos',picked:'Selected',selectVisible:'Select visible',clear:'Clear this category',copy:'Copy selected',download:'Export TXT',more:'Show more',done:'Copied',copyFail:'Copy unavailable; use TXT export.',none:'No matching brands.',noLogo:'No logo',brokenLogo:'Logo failed',hasLogo:'Logo loaded',models:'models',unknownModels:'No model data',loading:'Loading catalog...',loadFail:'Could not load catalog. Open through GitHub Pages.',footer:'Review tool only. Selections do not modify listings or brand data.',light:'Light theme',dark:'Dark theme',categories:['Cars','Motorcycles','Watercraft','Aircraft','Agriculture','Construction','Commercial','Caravans & other']},

tr:{heading:'Logo kontrolü',subtitle:'Gizli kontrol sayfası • 8 kategori',notice:'Yanlış, farklı markaya ait, kalitesiz veya eksik logoları seçin. Seçimler bu tarayıcıda saklanır. URL gizlidir ancak erişim korumalı değildir.',search:'Marka ara...',all:'Tüm markalar',missing:'Eksik / bozuk logolar',selected:'Seçilenler',models0:'Modeli olmayanlar',total:'Markalar',available:'Açılan logolar',broken:'Eksik logolar',picked:'Seçilen',selectVisible:'Görünenleri seç',clear:'Kategoriyi temizle',copy:'Seçilenleri kopyala',download:'TXT dışa aktar',more:'Daha fazla göster',done:'Kopyalandı',copyFail:'Kopyalama başarısız; TXT dışa aktarın.',none:'Eşleşen marka yok.',noLogo:'Logo yok',brokenLogo:'Logo açılamadı',hasLogo:'Logo açıldı',models:'model',unknownModels:'Model verisi yok',loading:'Katalog yükleniyor...',loadFail:'Katalog yüklenemedi. GitHub Pages üzerinden açın.',footer:'Yalnızca kontrol aracıdır. Seçimler site verilerini değiştirmez.',light:'Açık tema',dark:'Koyu tema',categories:['Otomobil','Motosiklet','Deniz taşıtları','Hava taşıtları','Tarım','İş makineleri','Ticari','Karavan ve diğer']},
ka:{heading:'ლოგოების შემოწმება',subtitle:'დამალული გვერდი • 8 კატეგორია',notice:'მონიშნეთ ბრენდები არასწორი, უხარისხო ან დაკარგული ლოგოთი. არჩევანი ინახება ამ ბრაუზერში. ბმული არ არის საჯაროდ ჩამოთვლილი, მაგრამ წვდომა დაცული არ არის.',search:'ბრენდის ძიება...',all:'ყველა ბრენდი',missing:'ლოგო არ არის / შეცდომა',selected:'მონიშნული',models0:'მოდელების გარეშე',total:'ბრენდები',available:'ლოგო ჩაიტვირთა',broken:'ლოგო არ არის',picked:'მონიშნული',selectVisible:'ხილულის მონიშვნა',clear:'კატეგორიის გასუფთავება',copy:'მონიშნულის კოპირება',download:'TXT ექსპორტი',more:'მეტის ჩვენება',done:'დაკოპირებულია',copyFail:'კოპირება ვერ მოხერხდა; გამოიყენეთ TXT ექსპორტი.',none:'ბრენდი ვერ მოიძებნა.',noLogo:'ლოგო არ არის',brokenLogo:'ლოგო ვერ ჩაიტვირთა',hasLogo:'ლოგო ჩაიტვირთა',models:'მოდელი',unknownModels:'მოდელების მონაცემები არ არის',loading:'კატალოგი იტვირთება...',loadFail:'კატალოგი ვერ ჩაიტვირთა. გახსენით GitHub Pages-იდან.',footer:'მხოლოდ შემოწმებისთვის. არჩევანი არ ცვლის საიტის მონაცემებს.',light:'ღია თემა',dark:'მუქი თემა',categories:['ავტომობილები','მოტოციკლები','წყლის ტრანსპორტი','საჰაერო ტრანსპორტი','სოფლის მეურნეობა','სამშენებლო ტექნიკა','კომერციული','ქარავანი და სხვა']}}
const $=id=>document.getElementById(id), ids=['car','motorcycle','watercraft','aircraft','agriculture','construction','commercial','caravan'];
let lang=localStorage.getItem('avtovip-logo-qa-lang')||'az';if(!translations[lang])lang='az';let theme=localStorage.getItem('avtovip-logo-qa-theme')||((matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light');
let entries={},manifest={},status=new Map(),selection=new Set(),limit=120,category='car',filter='all',search='';
try{selection=new Set(JSON.parse(localStorage.getItem('avtovip-logo-qa-selection')||'[]'))}catch(e){}
const t=()=>translations[lang];const key=(cat,name)=>JSON.stringify([cat,name]);
const save=()=>{try{localStorage.setItem('avtovip-logo-qa-selection',JSON.stringify([...selection]))}catch(e){}};
const themeApply=()=>{document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'☀ '+t().light:'☾ '+t().dark};
const norm=s=>String(s||'').normalize('NFKC').toLocaleLowerCase().trim();
function labelApply(){document.documentElement.lang=lang;$('heading').textContent=t().heading;$('subtitle').textContent=t().subtitle;$('notice').textContent=t().notice;$('search').placeholder=t().search;$('selectVisible').textContent=t().selectVisible;$('clearCategory').textContent=t().clear;$('copy').textContent=t().copy;$('download').textContent=t().download;$('more').textContent=t().more;$('footer').textContent=t().footer;['all','missing','selected','models0'].forEach((v,i)=>$('filter').options[i].textContent=t()[v]);$('category').replaceChildren(...ids.map((id,i)=>{const o=document.createElement('option');o.value=id;o.textContent=t().categories[i];return o}));$('category').value=category;themeApply();render()}
function logoPath(cat,name,carItem){const m=manifest[cat]||{};if(m[name])return m[name];if(carItem?.logo?.local_url)return carItem.logo.local_url;const match=Object.keys(m).find(k=>norm(k)===norm(name));return match?m[match]:null}
function register(cat,name,models,carItem){const path=logoPath(cat,name,carItem);return{name,cat,models,logo:path}}
async function getJSON(url){const res=await fetch(url,{cache:'no-cache'});if(!res.ok)throw Error(url+' '+res.status);return res.json()}
async function init(){try{const [makes,categories,extended,logos]=await Promise.all([getJSON('assets/data/vehicle-makes.json'),getJSON('assets/data/vehicle-categories.json'),getJSON('assets/data/avtovip-extended-catalog.json'),getJSON('assets/data/brand-logo-manifest.json')]);manifest=logos.categories||{};const modelCount={};try{const response=await fetch('assets/data/vehicle-models.csv',{cache:'no-cache'});if(response.ok){const csv=await response.text();for(const line of csv.split(/\r?\n/).slice(1)){if(!line)continue;const parts=line.split(',');if(parts.length<3)continue;const name=parts[1];(modelCount[name]??=new Set()).add(parts[2])}}}catch(e){}entries.car=makes.map(x=>register('car',x.name,modelCount[x.name]?.size??0,x));for(const id of ids.slice(1)){const source=categories.find(x=>x.id===id);const ext=extended[id]||{};const all=new Map();for(const name of source?.brands||[])all.set(norm(name),name);for(const name of Object.keys(ext))if(!all.has(norm(name)))all.set(norm(name),name);entries[id]=[...all.values()].map(name=>register(id,name,Array.isArray(ext[name])?ext[name].length:0))}render()}catch(e){$('message').textContent=t().loadFail;console.error(e)}}
function visibleEntries(){let rows=entries[category]||[];if(search)rows=rows.filter(e=>norm(e.name).includes(norm(search)));if(filter==='selected')rows=rows.filter(e=>selection.has(key(e.cat,e.name)));if(filter==='missing')rows=rows.filter(e=>!e.logo||status.get(key(e.cat,e.name))==='broken');if(filter==='models0')rows=rows.filter(e=>e.models===0);return rows}
function statsRender(){const all=entries[category]||[];const good=all.filter(e=>e.logo&&status.get(key(e.cat,e.name))!=='broken').length;const bad=all.length-good;const chosen=all.filter(e=>selection.has(key(e.cat,e.name))).length;$('stats').replaceChildren(...[[t().total,all.length],[t().available,good],[t().broken,bad],[t().picked,chosen]].map(([label,value])=>{const d=document.createElement('div');d.className='stat';const s=document.createElement('strong');s.textContent=value;const n=document.createElement('span');n.textContent=label;d.append(s,n);return d}))}
function tile(e){const k=key(e.cat,e.name),b=document.createElement('div');b.className='tile'+(selection.has(k)?' chosen':'');b.tabIndex=0;b.setAttribute('role','checkbox');b.setAttribute('aria-checked',selection.has(k)?'true':'false');b.setAttribute('aria-label',e.name);const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=selection.has(k);check.tabIndex=-1;check.setAttribute('aria-hidden','true');const visual=document.createElement('div');const state=document.createElement('span');state.className='status';function updateState(broken){state.textContent=!e.logo?t().noLogo:broken?t().brokenLogo:t().hasLogo;state.className='status '+(!e.logo||broken?'bad':'good')}
if(e.logo){const img=document.createElement('img');img.loading='lazy';img.alt=e.name;img.src=e.logo;img.addEventListener('error',()=>{status.set(k,'broken');img.replaceWith(fallback());updateState(true);statsRender()});img.addEventListener('load',()=>{status.set(k,'ok');updateState(false);statsRender()});visual.append(img)}else visual.append(fallback());function fallback(){const d=document.createElement('div');d.className='initial';d.textContent=e.name.slice(0,2).toUpperCase();return d}updateState(status.get(k)==='broken');const title=document.createElement('div');title.className='brand';title.textContent=e.name;const count=document.createElement('div');count.className='models';count.textContent=e.models+' '+t().models;function toggle(){if(selection.has(k))selection.delete(k);else selection.add(k);save();b.classList.toggle('chosen',selection.has(k));b.setAttribute('aria-checked',selection.has(k)?'true':'false');check.checked=selection.has(k);statsRender();if(filter==='selected')render()}b.addEventListener('click',toggle);b.addEventListener('keydown',ev=>{if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();toggle()}});b.append(check,visual,title,state,count);return b}
function render(){if(!Object.keys(entries).length)return;statsRender();const rows=visibleEntries();const chunk=rows.slice(0,limit);$('grid').replaceChildren(...chunk.map(tile));$('more').hidden=rows.length<=limit;$('message').textContent=rows.length?'':t().none;$('selectVisible').disabled=!chunk.length;$('clearCategory').disabled=![...selection].some(k=>{try{return JSON.parse(k)[0]===category}catch(e){return false}});$('copy').disabled=!selection.size;$('download').disabled=!selection.size}
function selectionText(){const grouped={};for(const k of selection){try{const [cat,name]=JSON.parse(k);(grouped[cat]??=[]).push(name)}catch(e){}}return ids.filter(id=>grouped[id]?.length).map(id=>'['+id+'] ('+grouped[id].length+')\n'+grouped[id].sort((a,b)=>a.localeCompare(b)).join('\n')).join('\n\n')}
$('lang').value=lang;$('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('avtovip-logo-qa-lang',lang);labelApply()});$('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('avtovip-logo-qa-theme',theme);themeApply()});$('category').addEventListener('change',e=>{category=e.target.value;limit=120;render()});$('filter').addEventListener('change',e=>{filter=e.target.value;limit=120;render()});$('search').addEventListener('input',e=>{search=e.target.value;limit=120;render()});$('more').addEventListener('click',()=>{limit+=120;render()});$('selectVisible').addEventListener('click',()=>{for(const e of visibleEntries().slice(0,limit))selection.add(key(e.cat,e.name));save();render()});$('clearCategory').addEventListener('click',()=>{for(const k of [...selection]){try{if(JSON.parse(k)[0]===category)selection.delete(k)}catch(e){}}save();render()});$('copy').addEventListener('click',async()=>{const txt=selectionText();try{await navigator.clipboard.writeText(txt);$('message').textContent=t().done}catch(e){$('message').textContent=t().copyFail}});$('download').addEventListener('click',()=>{const blob=new Blob([selectionText()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='avtovip-logo-secimler.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});labelApply();$('message').textContent=t().loading;init();
})();
</script></body></html>
