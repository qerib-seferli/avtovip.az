name: Review public catalog sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and match public source candidates (no live catalog modification)
        run: python scripts/catalog/catalog_sync.py
      - name: Summarize source status
        if: always()
        run: |
          echo "Candidate CSV is a review-only artifact; no live catalog files were modified." >> "$GITHUB_STEP_SUMMARY"
          echo "Wikidata may be rate-limited. Inspect job logs for partial_sources/errors." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avtovip-catalog-candidates
          path: assets/data/catalog-import-review.csv
          if-no-files-found: error
