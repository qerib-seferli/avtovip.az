name: Review Vehicle Catalog Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate unified catalog without modifying it
        run: |
          python - <<'PYVALIDATE'
          import json, pathlib
          path=pathlib.Path('assets/data/avtovip-unified-catalog.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          categories=('car','motorcycle','watercraft','aircraft','agriculture','construction','commercial','caravan')
          assert set(data)==set(categories), 'Unexpected category set'
          for category in categories:
              assert isinstance(data[category],dict), category
              for brand,models in data[category].items():
                  assert isinstance(brand,str) and brand.strip(), (category,brand)
                  assert isinstance(models,list) and all(isinstance(x,str) for x in models), (category,brand)
              print(f'{category}: {len(data[category])} brands, {sum(map(len,data[category].values()))} models')
          PYVALIDATE
      - name: Summary
        run: echo 'Unified catalog validated. No files changed or committed.' >> "$GITHUB_STEP_SUMMARY"
