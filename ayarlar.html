<!doctype html><html lang="az"><head><meta charset="utf-8"><script data-avtovip-boot>(function(){try{var l=localStorage.getItem('avtovip-lang')||'az',t=localStorage.getItem('avtovip-theme')||'light';document.documentElement.lang=l;document.documentElement.dataset.lang=l;document.documentElement.dataset.theme=t;document.documentElement.classList.add('av-preboot')}catch(e){}})();</script><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#9d111b"><link rel="manifest" href="site.webmanifest"><link rel="icon" href="assets/img/brand/icon-192.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/css/app.css?v=20"><link rel="stylesheet" href="assets/css/patch11.css?v=20"><link rel="stylesheet" href="assets/css/ui-pro.css?v=20"><title>Tənzimləmələr — AvtoVİP</title></head><body data-page="settings"><header class="site-header"><div class="container header-row"><a class="brand" href="index.html"><img src="assets/img/brand/logo.png" alt="AvtoVİP"></a><div class="header-actions"><a class="icon-btn" href="profile.html"><i class="fa-solid fa-xmark"></i></a></div></div></header><main class="page"><div class="container stack" style="max-width:760px"><div class="section-head"><h1>Tənzimləmələr</h1></div><section class="panel panel-pad"><div class="field"><label>Dil</label><select id="settingsLang"><option value="az">🇦🇿 Azərbaycan</option><option value="en">🇬🇧 English</option><option value="ru">🇷🇺 Русский</option><option value="tr">🇹🇷 Türkçe</option><option value="ka">🇬🇪 ქართული</option></select></div><div class="field" style="margin-top:14px"><label>Tema</label><select id="settingsTheme"><option value="light">Açıq tema</option><option value="dark">Qaranlıq tema</option></select></div></section><section class="panel panel-pad"><div class="section-head"><h3>Bildiriş və səslər</h3></div><label class="check-chip"><input id="soundToggle" type="checkbox"><span>AvtoVİP mesaj və bildiriş səsləri</span></label><p class="muted small" style="margin-top:10px">Səs brauzerin icazə və enerji qaydalarına uyğun işləyir.</p></section><section class="panel panel-pad"><div class="section-head"><h3>Məxfilik və təhlükəsizlik</h3></div><div class="stack"><a class="btn btn-outline btn-block" href="reset-password.html"><i class="fa-solid fa-key"></i> Şifrəni dəyiş</a><button class="btn btn-outline btn-block" id="settingsLogout"><i class="fa-solid fa-right-from-bracket"></i> Hesabdan çıx</button></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/international.js"></script><script src="assets/js/app.js?v=20"></script><script src="assets/js/social.js?v=20"></script><script src="assets/js/patch11.js?v=20"></script><script src="assets/js/ui-pro.js?v=20"></script><script>document.addEventListener('DOMContentLoaded',()=>{const l=document.querySelector('#settingsLang'),t=document.querySelector('#settingsTheme'),s=document.querySelector('#soundToggle');l.value=localStorage.getItem('avtovip-lang')||'az';t.value=localStorage.getItem('avtovip-theme')||'light';s.checked=localStorage.getItem('avtovip-sounds')!=='off';l.onchange=()=>{localStorage.setItem('avtovip-lang',l.value);location.reload()};t.onchange=()=>{localStorage.setItem('avtovip-theme',t.value);document.documentElement.dataset.theme=t.value};s.onchange=()=>localStorage.setItem('avtovip-sounds',s.checked?'on':'off');document.querySelector('#settingsLogout').onclick=async()=>{await avtoDb.client.auth.signOut();location.href='index.html'}})</script></body></html>
